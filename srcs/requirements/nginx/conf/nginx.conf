server {
    # The project requires NGINX to be the only entrypoint via port 443
    listen 443 ssl;
    server_name acaire-d.42.fr;

    # Paths to the certificates generated with OpenSSL
    ssl_certificate /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Strictly enforce TLSv1.2 and TLSv1.3 protocols
    ssl_protocols TLSv1.2 TLSv1.3;

    # Root directory where the WordPress volume will be mounted
    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Forward PHP requests to the isolated WordPress container on port 9000
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}